<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A1A">
<title>Aguante</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
/* Layout: one phone-width column; sticky emergency header, routed views, bottom section bar. Durante screens switch to the night palette. */
:root {
  --paper: #F4F2EC; --card: #FFFFFF; --ink: #1A1A1A; --muted: #55524A; --line: #D9D4C7;
  --senal: #FFC72C; --senal-ink: #1A1A1A; --refugio: #1F6F78; --refugio-fg: #1F6F78; --auxilio: #C8202A;
  --night: #141414; --night-card: #242320; --night-line: #3C3A35; --night-ink: #F4F2EC; --night-muted: #CFCABF; --alerta: #FF5A4F;
  --tint: #ECE7DA; --bar: #1A1A1A; --bar-ink: #F4F2EC;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #171614; --card: #23221F; --ink: #F1EEE6; --muted: #BDB8AC; --line: #3B3934;
  --refugio-fg: #74C6CF; --tint: #2C2A26; --bar: #000000; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #171614; --card: #23221F; --ink: #F1EEE6; --muted: #BDB8AC; --line: #3B3934;
  --refugio-fg: #74C6CF; --tint: #2C2A26; --bar: #000000; color-scheme: dark }

html { font-size: 17px; }
html.grande { font-size: 20px; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
body.noche { background: var(--night); color: var(--night-ink); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--refugio-fg); }
:focus-visible { outline: 3px solid var(--senal); outline-offset: 2px; }
.ico { width: 1.4rem; height: 1.4rem; flex: none; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
body.noche .top { background: #000; color: var(--night-ink); }
.top .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; min-height: 44px; }
.brand span { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; letter-spacing: .04em; }
.chip { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid currentColor; background: transparent; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .9rem; cursor: pointer; }
.sos-row { display: flex; gap: 8px; }
.btn-aux { flex: 1; min-height: 52px; border: 0; border-radius: 12px; background: var(--auxilio); color: #fff; font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.btn-audio { width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid var(--senal); background: transparent; color: var(--senal); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.btn-audio[aria-pressed="true"] { background: var(--senal); color: var(--senal-ink); }
.prueba { background: var(--senal); color: var(--senal-ink); }
.prueba .wrap { padding-block: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .82rem; font-weight: 700; flex-wrap: wrap; }
.prueba button { min-height: 36px; border: 2px solid var(--senal-ink); border-radius: 18px; background: transparent; padding: 0 12px; font-weight: 700; font-size: .82rem; cursor: pointer; }

/* main */
main .wrap { padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
body.noche .eyebrow { color: var(--night-muted); }
.h-xl { font-size: 2.6rem; text-transform: uppercase; }
.h-l { font-size: 2rem; text-transform: uppercase; }
.h-m { font-size: 1.45rem; text-transform: uppercase; }
.lead { font-size: 1.1rem; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.back { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; text-decoration: none; color: inherit; }

/* que pasa grid */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { min-height: 124px; border-radius: var(--r); background: var(--bar); color: var(--bar-ink); text-decoration: none; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
:root[data-theme="dark"] .tile { border: 2px solid var(--line); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile { border: 2px solid var(--line); } }
.tile svg { width: 2.4rem; height: 2.4rem; color: var(--senal); }
.tile b { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; line-height: 1.02; }
.tile.ayuda { background: var(--auxilio); color: #fff; border: 0; }
.tile.ayuda svg { color: #fff; }

/* cards & rows */
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { min-height: 64px; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
.row .ico-box { width: 44px; height: 44px; border-radius: 10px; background: var(--bar); color: var(--senal); display: flex; align-items: center; justify-content: center; flex: none; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .txt b { font-size: 1.05rem; }
.row .txt small { color: var(--muted); font-size: .88rem; }
.row .chev { width: 1.2rem; height: 1.2rem; color: var(--muted); flex: none; }
.meter { height: 8px; border-radius: 4px; background: var(--tint); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--refugio); border-radius: 4px; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 13px; font-size: .8rem; font-weight: 700; background: var(--tint); }

/* checklist */
.check { min-height: 56px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
.check input { width: 26px; height: 26px; accent-color: var(--refugio); flex: none; margin: 0; }
.check:has(input:checked) span { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
body.noche .check { background: var(--night-card); border-color: var(--night-line); }
body.noche .check:has(input:checked) span { color: var(--night-muted); }

/* hero band (Antes / Después) */
.band { border-radius: var(--r); background: var(--refugio); color: #fff; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.band .meter { background: rgba(0,0,0,.25); }
.band .meter i { background: var(--senal); }

/* alert levels */
.lvl { border-radius: var(--r); padding: 16px; display: flex; gap: 14px; align-items: flex-start; border: 2px solid var(--ink); }
.lvl .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 2px; border: 2px solid var(--ink); }
.lvl b { font-family: var(--f-display); font-size: 1.35rem; text-transform: uppercase; }

/* durante (noche) */
.step { display: flex; flex-direction: column; gap: 18px; }
.step .picto { width: 9rem; height: 9rem; color: var(--senal); align-self: center; }
.step h1 { font-size: 3rem; color: var(--senal); text-transform: uppercase; line-height: .95; }
.step .lead { font-size: 1.25rem; }
.step .why { color: var(--night-muted); }
.opt { min-height: 68px; border-radius: var(--r); padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 1.12rem; text-decoration: none; cursor: pointer; width: 100%; text-align: left; }
.opt.primary { background: var(--night-ink); color: #1A1A1A; border: 0; }
.opt.ghost { background: transparent; color: var(--senal); border: 3px solid var(--senal); }
.opt.call { background: var(--auxilio); color: #fff; border: 0; }
.opt svg { width: 1.3rem; height: 1.3rem; flex: none; }
.tag-prueba { align-self: flex-start; font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: var(--night-card); color: var(--night-muted); }

/* forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: .95rem; }
label.f input, label.f select, label.f textarea { min-height: 48px; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); font-weight: 400; width: 100%; }
label.f textarea { min-height: 96px; resize: vertical; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .two { grid-template-columns: minmax(0, 1fr); } }
.btn { min-height: 48px; border-radius: 12px; padding: 0 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; border: 2px solid var(--ink); background: transparent; color: var(--ink); }
.btn.fill { background: var(--ink); color: var(--paper); }
.btn.senal { background: var(--senal); color: var(--senal-ink); border-color: var(--senal); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.persona { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.persona .x { min-height: 48px; width: 48px; border-radius: 10px; border: 2px solid var(--line); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* tarjeta */
.tarjeta { border: 3px solid var(--ink); border-radius: 16px; background: #FFFFFF; color: #1A1A1A; overflow: hidden; }
.tarjeta .t-head { background: var(--senal); color: #1A1A1A; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.tarjeta .t-head b { font-family: var(--f-display); font-size: 1.5rem; letter-spacing: .04em; }
.tarjeta .t-body { padding: 14px 16px; display: grid; gap: 10px; }
.tarjeta dt { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #55524A; }
.tarjeta dd { margin: 0; font-weight: 700; }
.tarjeta dl { margin: 0; display: grid; gap: 10px; }
.vacio { color: #8A857A; font-weight: 400; font-style: italic; }

/* numbers sheet + overlays */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 88vh; overflow: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 22px; border: 2px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.num { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.num .n { font-family: var(--f-display); font-weight: 800; font-size: 2rem; min-width: 3.2rem; user-select: all; font-variant-numeric: tabular-nums; }
.num .acts { display: flex; gap: 6px; }
.num .acts a, .num .acts button { min-height: 44px; padding: 0 12px; border-radius: 10px; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
.num .acts a { background: var(--auxilio); color: #fff; border: 0; }
.num .acts button { background: transparent; border: 2px solid var(--line); }
.overlay { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay.luz { background: #FFFFFF; color: #1A1A1A; }
.overlay.sos { background: #000; color: #fff; }
.overlay.sos.on { background: #FFFFFF; color: #1A1A1A; }
.overlay .close { min-height: 56px; padding: 0 28px; border-radius: 28px; border: 3px solid currentColor; background: transparent; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
.overlay p { font-weight: 700; margin-bottom: 16px; text-align: center; }

/* tools grid */
.tool { min-height: 116px; border-radius: var(--r); background: var(--card); border: 2px solid var(--line); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-decoration: none; color: inherit; cursor: pointer; text-align: left; }
.tool svg { width: 2rem; height: 2rem; color: var(--refugio-fg); }
.tool b { font-size: 1.05rem; }
.tool small { color: var(--muted); font-size: .85rem; }
.tool[aria-pressed="true"] { background: var(--senal); color: var(--senal-ink); border-color: var(--senal); }
.tool[aria-pressed="true"] svg, .tool[aria-pressed="true"] small { color: var(--senal-ink); }
.compass { width: 220px; height: 220px; border-radius: 50%; border: 4px solid var(--ink); align-self: center; position: relative; display: flex; align-items: center; justify-content: center; }
.compass .needle { width: 8px; height: 180px; transition: transform .2s; background: linear-gradient(var(--auxilio) 50%, var(--ink) 50%); border-radius: 4px; }
.compass .n-lbl { position: absolute; top: 6px; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; }
pre.msg { white-space: pre-wrap; margin: 0; font-family: var(--f-body); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
body.noche .nav { background: #000; border-top-color: var(--night-line); }
.nav .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-block: 0; }
.nav a { min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: .74rem; font-weight: 700; border-top: 4px solid transparent; }
body.noche .nav a { color: var(--night-muted); }
.nav a svg { width: 1.35rem; height: 1.35rem; }
.nav a[aria-current="page"] { color: var(--ink); border-top-color: var(--senal); }
body.noche .nav a[aria-current="page"] { color: var(--night-ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); }
.seg { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.seg legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.seg .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; flex: 1 1 140px; min-height: 60px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; background: var(--card); }
.seg label small { color: var(--muted); font-size: .82rem; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { border-color: var(--senal); background: var(--senal); color: var(--senal-ink); }
.seg label:has(input:checked) small { color: var(--senal-ink); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--refugio-fg); outline-offset: 2px; }
.btn-start { min-height: 72px; border: 0; border-radius: var(--r); background: var(--auxilio); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; }
.overlay.aux { background: #000; color: #F4F2EC; justify-content: center; gap: 18px; text-align: center; }
.overlay.aux.on { background: #FFFFFF; color: #1A1A1A; }
.overlay.aux h2 { font-size: 3rem; text-transform: uppercase; }
.overlay.aux .code { font-family: var(--f-display); font-weight: 800; font-size: 2rem; letter-spacing: .2em; }
.overlay.aux p { margin: 0; }
.install { background: var(--senal); color: var(--senal-ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.install .btn { border-color: var(--senal-ink); color: var(--senal-ink); align-self: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>

  /* text size */
  function applySize() { document.documentElement.classList.toggle('grande', !!state.grande); }
  applySize();

  /* toast */
  var tt = null;
  function toast(msg) { var d = document.querySelector('.toast'); if (!d) { d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); document.body.appendChild(d); } d.textContent = msg; d.hidden = false; clearTimeout(tt); tt = setTimeout(function () { d.hidden = true; }, 2600); }

  /* testers: comment on the current screen */
  var comments = null;
  if (window.claude && window.claude.use) {
    window.claude.use('comments').then(function (c) { comments = c; if (c) document.getElementById('commentBtn').hidden = false; }, function () {});
  }
  document.getElementById('commentBtn').addEventListener('click', function () {
    if (!comments) return;
    comments.openComposer({ element: view }).catch(function () { toast('No se pudo abrir el comentario. Probá de nuevo en un momento.'); });
  });

  /* ---------- instalar como app ---------- */
  var deferred = null;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function installCard() {
    if (standalone || load('installHidden', false)) return '';
    var how = deferred ? '<button type="button" class="btn" id="installBtn">Instalar Aguante</button>'
      : ios ? '<p>En Safari, tocá <b>Compartir</b> y después <b>Agregar a inicio</b>.</p>'
      : '<p>Abrí el menú del navegador y elegí <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</p>';
    return '<div class="install"><b class="h-m" style="font-family:var(--f-display)">Instalá Aguante</b><p>Queda como una app en tu celular y funciona sin señal.</p>' + how +
      '<button type="button" class="back" id="installHide" style="border:0;background:none;padding:0;cursor:pointer">Ahora no</button></div>';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; if (current() === 'inicio') render(); });
  window.addEventListener('appinstalled', function () { deferred = null; standalone = true; toast('Aguante quedó instalada'); if (current() === 'inicio') render(); });
  view.addEventListener('click', function (e) {
    if (e.target.closest('#installBtn') && deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; render(); }); }
    if (e.target.closest('#installHide')) { save('installHidden', true); render(); }
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (!navigator.serviceWorker.controller) reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (w) w.addEventListener('statechange', function () { if (w.state === 'activated') toast('Listo: Aguante ya funciona sin conexión'); });
      });
    }).catch(function () {});
  }

  render();
})();
</script>

</body>
</html>
